<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeraForge AI - by Bera Tech</title>
<style>
:root{--bg:#07080D;--panel:#0D1019;--panel2:#121726;--border:#1E2535;--border2:#2A3349;--violet:#8B5CF6;--cyan:#22D3EE;--text:#EEF0F7;--muted:#8B93A7;--ok:#34D399;--warn:#FBBF24;--err:#F87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--cyan);text-decoration:none}
.muted{color:var(--muted)}
.grad{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px}
.btn{background:transparent;border:1px solid var(--border2);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-grad{background:linear-gradient(90deg,var(--violet),#6D5BF0);border:0;color:#fff;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn-grad:disabled{opacity:.5;cursor:not-allowed}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border2);color:var(--muted);white-space:nowrap}
.badge.ready{color:var(--ok);border-color:rgba(52,211,153,.4)}
.badge.failed{color:var(--err);border-color:rgba(248,113,113,.4)}
.badge.working{color:var(--cyan);border-color:rgba(34,211,238,.4)}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:60px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--border)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--cyan));display:grid;place-items:center;font-weight:800;color:#fff}
.topnav a{color:var(--muted);cursor:pointer;margin-left:18px}
.topnav a:hover{color:var(--text)}
.side,.right{padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.side{border-right:1px solid var(--border)}
.right{border-left:1px solid var(--border)}
.recent button{display:block;width:100%;background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;color:var(--muted);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent button:hover{color:var(--text);background:var(--panel2)}
.sidenav a{display:block;color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer}
.sidenav a:hover{color:var(--text);background:var(--panel2)}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}
.main{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;min-height:0}
.hero{padding:22px;background:radial-gradient(900px 260px at 85% -30%,rgba(139,92,246,.22),transparent),var(--panel)}
.hero h1{margin:0 0 4px;font-size:22px}
.hero p{margin:0 0 14px;color:var(--muted)}
.prompt{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--border2);border-radius:12px;padding:10px;background:var(--bg)}
.prompt textarea,.composer textarea{flex:1;background:none;border:0;outline:none;resize:none;min-height:44px;max-height:140px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel2);border:1px solid var(--border2);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{padding:16px;cursor:pointer}
.pcard:hover{border-color:var(--violet)}
.pcard h3{margin:0 0 8px;font-size:15px}
.ws{display:flex;flex-direction:column;flex:1;min-height:620px;overflow:hidden}
.ws-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:none;border:0;padding:12px 10px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--violet)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:420px;max-height:60vh}
.msg{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--panel2);max-width:92%}
.msg.you{align-self:flex-end;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.35)}
.msg .who{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.hint{font-size:12px;color:var(--muted);padding:0 14px 10px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);align-items:flex-end}
.composer textarea{border:1px solid var(--border2);border-radius:10px;padding:9px 10px;background:var(--bg)}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;flex:1;min-height:420px}
#editor{flex:1;min-height:420px;background:#090B12;border:0;outline:none;resize:none;padding:14px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#D6DAE8;white-space:pre}
.seg{display:flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.frame-wrap{flex:1;display:flex;justify-content:center;background:#05060A;padding:12px;min-height:460px;overflow:auto}
#frame{background:#fff;border:0;border-radius:8px;height:100%;min-height:440px;max-width:100%;transition:width .2s}
.ver{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin:8px 14px}
.panel{padding:14px}
.panel h4{margin:0 0 10px;font-size:14px}
.arow{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.arow .st{margin-left:auto;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.working{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.2s infinite}
.dot.done{background:var(--ok)}
@keyframes pulse{50%{opacity:.35}}
.act{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.act b{display:block}
.act span{color:var(--muted);word-break:break-word}
.logbox{margin:0;background:#05060A;border:1px solid var(--border);border-radius:10px;padding:10px;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#B7BFD3;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--panel2);border:1px solid var(--border2);border-left:3px solid var(--cyan);padding:10px 14px;border-radius:10px;max-width:360px}
.toast.ok{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
@media (max-width:1180px){.app{grid-template-columns:200px minmax(0,1fr)}.right{display:none}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.side,.right,.topnav{display:none}header{padding:0 12px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <div class="logo">B</div>
      <div><div style="font-weight:700;font-size:18px"><span class="grad">BeraForge</span> AI</div><div class="muted" style="font-size:10px;letter-spacing:.12em">BY BERA TECH</div></div>
    </div>
    <nav class="topnav"><a data-go="home">Home</a><a data-go="projects">Projects</a></nav>
    <div class="spacer"></div>
    <span class="muted" style="font-size:12px">Deploy: not connected yet</span>
  </header>

  <aside class="side">
    <button class="btn-grad" data-go="home" style="width:100%">+ New Project</button>
    <nav class="sidenav"><a data-go="home">▦ Dashboard</a><a data-go="projects">▤ My Projects</a></nav>
    <div class="muted" style="font-size:11px;letter-spacing:.1em">RECENT</div>
    <div class="recent" id="recent"></div>
    <div class="card panel" id="plan"></div>
    <div class="spacer"></div>
    <div class="muted" style="font-size:11px"><span class="grad" style="font-weight:700">BeraForge AI</span><br>BY BERA TECH</div>
  </aside>

  <main class="main" id="main"></main>
  <aside class="right" id="right"></aside>
</div>
<div class="toasts" id="toasts"></div>

<script>
const CHIPS = {
  'Full Stack App': 'A todo app with a clean UI and a settings panel',
  'Website': 'A one-page marketing site for a software startup with a hero, features and a contact form',
  'API': 'A REST API explorer where I can send a request to a URL and view formatted JSON',
  'Mobile App': 'A mobile-first habit tracker with daily check-ins and streak counters',
  'Dashboard': 'An analytics dashboard with KPI cards, a chart and a recent activity table',
  'Blog': 'A minimal blog with a post list, a reading view and a search box',
  'E-commerce': 'An e-commerce storefront with a product grid, cart drawer and checkout summary'
};
const AGENTS = ['Orchestrator', 'Assistant', 'Builder', 'QA'];
const LABEL = { draft: 'Draft', working: 'Working', ready: 'Ready', failed: 'Failed' };

const S = {
  view: 'home', projects: [], project: null, messages: [], status: 'draft',
  tab: 'chat', device: 'desktop', es: null, dirty: false
};

const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};

async function api(path, opts = {}) {
  const init = { method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, init);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ---------- Data and live stream ---------- */
async function loadProjects() {
  try { S.projects = (await api('/api/projects')).projects; }
  catch (e) { toast(e.message, 'error'); }
  renderSide();
}

function closeStream() {
  if (S.es) { S.es.close(); S.es = null; }
}

function connect(id) {
  closeStream();
  const es = new EventSource(`/api/projects/${encodeURIComponent(id)}/events`);
  S.es = es;
  const current = () => S.project && S.project.id === id;

  es.addEventListener('snapshot', (e) => {
    if (!current()) return;
    const d = JSON.parse(e.data);
    S.messages = d.messages;
    S.status = d.status;
    refreshLive();
  });
  es.addEventListener('message', (e) => {
    if (!current()) return;
    const m = JSON.parse(e.data);
    if (!S.messages.some((x) => x.id === m.id)) S.messages.push(m);
    refreshLive();
  });
  es.addEventListener('status', async (e) => {
    if (!current()) return;
    const before = S.status;
    S.status = JSON.parse(e.data).status;
    if (before === 'working' && S.status !== 'working') await reloadProject();
    refreshLive();
  });
}

async function reloadProject() {
  if (!S.project) return;
  try {
    const fresh = await api(`/api/projects/${encodeURIComponent(S.project.id)}`);
    S.project = fresh;
    const keepEditor = S.tab === 'code' && S.dirty;
    if (!keepEditor && ['preview', 'code', 'versions'].includes(S.tab)) renderMain();
  } catch (e) { toast(e.message, 'error'); }
}

/* ---------- Navigation ---------- */
async function openProject(id) {
  try {
    S.project = await api(`/api/projects/${encodeURIComponent(id)}`);
    S.view = 'project';
    S.status = S.project.status;
    S.messages = [];
    S.tab = 'chat';
    S.dirty = false;
    connect(id);
    renderAll();
  } catch (e) { toast(e.message, 'error'); }
}

function goHome() {
  closeStream();
  S.project = null;
  S.messages = [];
  S.view = 'home';
  renderAll();
}

async function goProjects() {
  closeStream();
  S.project = null;
  S.messages = [];
  S.view = 'projects';
  await loadProjects();
  renderAll();
}

/* ---------- Actions ---------- */
async function sendText(text) {
  if (!S.project) return false;
  if (S.status === 'working') { toast('Still working on the last message.', 'warn'); return false; }
  try {
    await api(`/api/projects/${S.project.id}/messages`, { method: 'POST', body: { text } });
    S.status = 'working';
    refreshLive();
    return true;
  } catch (e) {
    toast(e.message, 'error');
    return false;
  }
}

async function startFromHero() {
  const text = ($('#heroText')?.value || '').trim();
  if (!text) return toast('Describe the page first.', 'warn');
  try {
    const p = await api('/api/projects', { method: 'POST', body: { name: text.slice(0, 40) } });
    await loadProjects();
    await openProject(p.id);
    await sendText(text);
  } catch (e) { toast(e.message, 'error'); }
}

async function sendFromComposer() {
  const box = $('#composer');
  const text = (box?.value || '').trim();
  if (!text) return;
  box.value = '';
  const ok = await sendText(text);
  if (!ok && $('#composer')) $('#composer').value = text;
}

async function saveHtml() {
  const html = $('#editor')?.value ?? '';
  try {
    await api(`/api/projects/${S.project.id}/html`, { method: 'PUT', body: { html } });
    S.project.html = html;
    S.dirty = false;
    toast('Saved index.html', 'ok');
    renderMain();
  } catch (e) { toast(e.message, 'error'); }
}

async function restore(versionId) {
  try {
    S.project = await api(`/api/projects/${S.project.id}/restore/${encodeURIComponent(versionId)}`, { method: 'POST' });
    S.dirty = false;
    toast('Checkpoint restored. The previous page is saved as a checkpoint too.', 'ok');
    renderMain();
  } catch (e) { toast(e.message, 'error'); }
}

async function renameProject() {
  const name = window.prompt('Project name', S.project.name);
  if (!name || !name.trim()) return;
  try {
    const p = await api(`/api/projects/${S.project.id}`, { method: 'PATCH', body: { name: name.trim() } });
    S.project.name = p.name;
    await loadProjects();
    renderMain();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteProject() {
  if (!confirm(`Delete "${S.project.name}"? This cannot be undone.`)) return;
  try {
    await api(`/api/projects/${S.project.id}`, { method: 'DELETE' });
    toast('Project deleted', 'ok');
    await loadProjects();
    goHome();
  } catch (e) { toast(e.message, 'error'); }
}

/* ---------- Rendering ---------- */
function renderAll() {
  renderSide();
  renderMain();
  renderRight();
}

function renderSide() {
  $('#recent').innerHTML = S.projects.slice(0, 8).map((p) =>
    `<button data-open="${esc(p.id)}">${esc(p.name)}</button>`
  ).join('') || '<span class="muted" style="font-size:12px">No projects yet</span>';
  const pct = Math.min(100, (S.projects.length / 10) * 100);
  $('#plan').innerHTML = `
    <div class="row" style="justify-content:space-between"><b>Free Plan</b><span class="muted" style="font-size:12px">${S.projects.length} / 10 projects</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>`;
}

function renderMain() {
  const el = $('#main');
  if (S.project) {
    el.innerHTML = workspace();
    refreshLive();
    return;
  }
  if (S.view === 'projects') {
    el.innerHTML = `<h3 style="margin:0">My Projects</h3>${projectsGrid()}`;
    return;
  }
  el.innerHTML = `
    <section class="card hero">
      <h1>✦ Build Your Next Application with <span class="grad">AI</span></h1>
      <p>Describe the page you want. The Builder writes it, QA checks it, and the preview shows the result.</p>
      <div class="prompt">
        <textarea id="heroText" rows="2" placeholder="A modern e-commerce page with a product grid and a checkout summary…"></textarea>
        <button class="btn-grad" data-action="hero">✦ Build</button>
      </div>
      <div class="chips">${Object.keys(CHIPS).map((k) => `<span class="chip" data-chip="${esc(k)}">${esc(k)}</span>`).join('')}</div>
    </section>
    <h3 style="margin:0">Recent projects</h3>
    ${projectsGrid()}`;
}

function projectsGrid() {
  if (!S.projects.length) return '<div class="card" style="padding:28px;text-align:center;color:var(--muted)">No projects yet. Describe a page above and press Build.</div>';
  return `<div class="grid">${S.projects.map((p) => `
    <div class="card pcard" data-open="${esc(p.id)}">
      <h3>${esc(p.name)}</h3>
      <div class="row" style="justify-content:space-between">
        <span class="badge ${esc(p.status)}">${esc(LABEL[p.status] || p.status)}</span>
        <span class="muted" style="font-size:12px">${ago(p.updatedAt)}</span>
      </div>
    </div>`).join('')}</div>`;
}

function workspace() {
  const p = S.project;
  const tabs = [['chat', 'Chat'], ['code', 'Code'], ['preview', 'Preview'], ['versions', 'Versions']];
  const body = S.tab === 'chat' ? chatTab()
    : S.tab === 'code' ? codeTab()
    : S.tab === 'preview' ? previewTab()
    : versionsTab();
  return `
    <section class="card ws">
      <div class="ws-head">
        <div style="font-weight:600;font-size:15px">▣ ${esc(p.name)}</div>
        <span class="badge" id="wsStatus">${esc(LABEL[S.status] || S.status)}</span>
        <div class="spacer"></div>
        <button class="btn" data-action="rename">Rename</button>
        <button class="btn" data-action="delete">Delete</button>
        <button class="btn-grad" disabled title="Deploy arrives in Phase 5">Deploy (Phase 5)</button>
      </div>
      <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
      ${body}
    </section>`;
}

function messagesHtml() {
  if (!S.messages.length) return '<div class="muted" style="margin:auto;text-align:center">No messages yet. Describe what to build below.</div>';
  return S.messages.map((m) => `
    <div class="msg ${m.agent === 'You' ? 'you' : ''}">
      <div class="who">${esc(m.agent)} · ${fmt(m.at)}</div>
      <div class="txt">${esc(m.text)}</div>
    </div>`).join('');
}

function chatTab() {
  return `
    <div class="msgs" id="msgs">${messagesHtml()}</div>
    <div class="hint">Start a message with /build to force a build, or /chat to force a reply.</div>
    <div class="composer">
      <textarea id="composer" rows="2" placeholder="Ask for a change, e.g. make the buttons red"></textarea>
      <button class="btn-grad" id="sendBtn" data-action="send">Send</button>
    </div>`;
}

function codeTab() {
  return `
    <div class="col">
      <div class="bar-row">
        <span>index.html <span id="dirty" style="color:var(--warn)">${S.dirty ? '● unsaved' : ''}</span></span>
        <button class="btn" data-action="saveHtml">Save (Ctrl+S)</button>
      </div>
      <textarea id="editor" spellcheck="false">${esc(S.project.html)}</textarea>
    </div>`;
}

function previewTab() {
  const widths = { desktop: '100%', tablet: '820px', mobile: '390px' };
  return `
    <div class="bar-row">
      <div class="seg">${Object.keys(widths).map((d) => `<button class="${S.device === d ? 'on' : ''}" data-device="${d}">${d}</button>`).join('')}</div>
      <div class="row">
        <button class="btn" data-action="refresh">↻ Refresh</button>
        <a class="btn" href="/preview/${esc(S.project.id)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"
        style="width:${widths[S.device]}" srcdoc="${esc(S.project.html)}"></iframe>
    </div>`;
}

function versionsTab() {
  const v = S.project.versions || [];
  if (!v.length) return '<div class="muted" style="padding:20px">No checkpoints yet. The previous page is saved here before each build.</div>';
  return v.map((x) => `
    <div class="ver">
      <div><b>${ago(x.at)}</b> <span class="muted">${esc(x.label)}</span></div>
      <button class="btn" data-action="restore" data-id="${esc(x.id)}">Restore</button>
    </div>`).join('');
}

// Updates only the live parts, so text typed in the composer or editor is kept.
function refreshLive() {
  const badge = $('#wsStatus');
  if (badge) {
    badge.className = `badge ${S.status}`;
    badge.textContent = LABEL[S.status] || S.status;
  }
  const box = $('#msgs');
  if (box) { box.innerHTML = messagesHtml(); box.scrollTop = box.scrollHeight; }
  const send = $('#sendBtn');
  if (send) send.disabled = S.status === 'working';
  const comp = $('#composer');
  if (comp) comp.disabled = S.status === 'working';
  renderRight();
}

function renderRight() {
  const msgs = S.messages;
  const working = S.status === 'working';
  const last = msgs[msgs.length - 1];
  const active = working ? (!last || last.agent === 'You' ? 'Orchestrator' : last.agent) : null;

  const agents = AGENTS.map((a) => {
    const st = a === active ? 'working' : msgs.some((m) => m.agent === a) ? 'done' : 'idle';
    return `<div class="arow"><span class="dot ${st}"></span><span>${a}</span><span class="st">${st}</span></div>`;
  }).join('');

  const activity = msgs.slice(-8).reverse().map((m) => `
    <div class="act"><b>${esc(m.agent)}</b><span>${esc(m.text.slice(0, 180))}</span>
    <div class="muted" style="font-size:11px">${ago(m.at)}</div></div>`).join('')
    || '<div class="muted">No agent activity yet.</div>';

  const logs = msgs.slice(-12).map((m) => `[${fmt(m.at)}] ${m.agent}: ${m.text.slice(0, 160)}`).join('\n')
    || (S.project ? 'No output yet.' : 'Open a project to see logs.');

  $('#right').innerHTML = `
    <div class="card panel">
      <h4>Live Agents ${working ? '<span style="color:var(--cyan);font-weight:500;font-size:12px">● working</span>' : ''}</h4>
      ${agents}
    </div>
    <div class="card panel"><h4>Agent Activity</h4>${activity}</div>
    <div class="card panel">
      <h4>Build &amp; Deployment Logs</h4>
      <pre class="logbox">${esc(logs)}</pre>
      <div class="muted" style="font-size:12px;margin-top:10px">Deploy is not connected yet (Phase 5).</div>
    </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-open],[data-tab],[data-device],[data-chip],[data-action]');
  if (!el) return;
  const d = el.dataset;
  if ('go' in d) return d.go === 'projects' ? goProjects() : goHome();
  if ('open' in d) return openProject(d.open);
  if ('tab' in d) { S.tab = d.tab; return renderMain(); }
  if ('device' in d) { S.device = d.device; return renderMain(); }
  if ('chip' in d) {
    const ta = $('#heroText');
    if (ta) { ta.value = CHIPS[d.chip]; ta.focus(); }
    return;
  }
  switch (d.action) {
    case 'hero': return startFromHero();
    case 'send': return sendFromComposer();
    case 'saveHtml': return saveHtml();
    case 'refresh': return renderMain();
    case 'rename': return renameProject();
    case 'delete': return deleteProject();
    case 'restore': return restore(d.id);
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'editor') {
    S.dirty = true;
    const tag = $('#dirty');
    if (tag) tag.textContent = '● unsaved';
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'heroText') {
    e.preventDefault();
    startFromHero();
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'composer') {
    e.preventDefault();
    sendFromComposer();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.project && S.tab === 'code') {
    e.preventDefault();
    saveHtml();
  }
});

/* ---------- Start ---------- */
(async function init() {
  await loadProjects();
  renderAll();
})();
</script>
</body>
</html>
