<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BeraForge AI - by Bera Tech</title>
<style>
:root{--bg:#07080D;--panel:#0D1019;--panel-2:#121726;--border:#1E2535;--border-2:#2A3349;--violet:#8B5CF6;--cyan:#22D3EE;--text:#EEF0F7;--muted:#8B93A7;--ok:#34D399;--warn:#FBBF24;--err:#F87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--cyan);text-decoration:none}
.muted{color:var(--muted)}
.gradtext{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px}
.btn{background:transparent;border:1px solid var(--border-2);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select.btn{background:var(--panel-2)}
.btn-grad{background:linear-gradient(90deg,var(--violet),#6D5BF0);border:0;color:#fff;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer}
.btn-grad:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{background:none;border:0;cursor:pointer;font-size:16px;padding:6px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border-2);color:var(--muted);white-space:nowrap}
.badge.ready,.badge.verified{color:var(--ok);border-color:rgba(52,211,153,.4)}
.badge.failed,.badge.error{color:var(--err);border-color:rgba(248,113,113,.4)}
.badge.building,.badge.working{color:var(--cyan);border-color:rgba(34,211,238,.4)}
.badge.untested{color:var(--warn);border-color:rgba(251,191,36,.35)}

.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;grid-template-rows:64px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--violet),var(--cyan));display:grid;place-items:center;font-weight:800;color:#fff}
.brand .name{font-size:19px;font-weight:700;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.topnav{display:flex;gap:18px;margin-left:24px}
.topnav a{color:var(--muted);cursor:pointer}
.topnav a:hover{color:var(--text)}
.spacer{flex:1}
.upgrade{border-color:var(--violet);color:#C4B5FD}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan));display:grid;place-items:center;font-weight:700}

.side{border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.new{width:100%;padding:11px}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav a{color:var(--muted);padding:9px 12px;border-radius:9px;cursor:pointer}
.sidenav a:hover{color:var(--text);background:var(--panel-2)}
.sidenav a.active{color:var(--text);background:var(--panel-2);box-shadow:inset 2px 0 0 var(--violet)}
.plan{padding:14px;margin-top:auto}
.bar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan))}

main{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
#content{display:flex;flex-direction:column;flex:1;min-height:0;gap:12px}
.hero{padding:22px;background:radial-gradient(900px 260px at 85% -30%,rgba(139,92,246,.28),transparent),var(--panel)}
.hero h1{margin:0;font-size:22px}
.hero p{margin:4px 0 14px;color:var(--muted)}
.prompt{display:flex;gap:10px;align-items:flex-end;border:1px solid var(--border-2);border-radius:12px;padding:10px;background:var(--bg)}
.prompt textarea{flex:1;background:none;border:0;outline:none;resize:none;min-height:44px;max-height:140px}
.prompt-side{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--panel-2);border:1px solid var(--border-2);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{padding:16px;cursor:pointer}
.pcard:hover{border-color:var(--violet)}
.pcard h3{margin:0 0 6px;font-size:15px}
.pcard p{margin:0 0 10px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:28px;text-align:center;color:var(--muted)}

.ws{display:flex;flex-direction:column;min-height:560px;flex:1;overflow:hidden}
.ws-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ws-title{font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center}
.change{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);align-items:center}
.change input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--border-2);border-radius:9px;padding:8px 10px;outline:none}
.change input:focus{border-color:var(--violet)}
.tabs{display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:none;border:0;padding:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--violet)}
.tabs .url{margin-left:auto;font-size:12px;padding:8px 0;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{display:grid;grid-template-columns:200px minmax(0,1fr);flex:1;min-height:0}
.explorer{border-right:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:2px}
.label{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:4px 6px 8px}
.file{background:none;border:0;text-align:left;padding:7px 8px;border-radius:7px;color:var(--muted);cursor:pointer}
.file.on,.file:hover{background:var(--panel-2);color:var(--text)}
.editor{display:flex;flex-direction:column;min-width:0}
.editor-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px}
#editor{flex:1;min-height:360px;background:#090B12;border:0;outline:none;resize:none;padding:14px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#D6DAE8;tab-size:2;white-space:pre}
.preview-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--border-2);border-radius:9px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel-2);color:var(--text)}
.frame-wrap{flex:1;display:flex;justify-content:center;background:#05060A;padding:12px;min-height:420px;overflow:auto}
#frame{background:#fff;border:0;border-radius:8px;height:100%;min-height:400px;max-width:100%;transition:width .2s}
.logs{margin:0;padding:14px;flex:1;overflow:auto;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#B7BFD3;background:#05060A;white-space:pre-wrap}
.lvl-error{color:var(--err)}
.lvl-warn{color:var(--warn)}
.lvl-info{color:#B7BFD3}
.versions{display:flex;flex-direction:column;gap:8px;padding:12px}
.ver{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th,.ptable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.ptable th{color:var(--muted);font-weight:500;font-size:12px}
.result{max-width:320px;word-break:break-word}
.preview{font-size:12px;margin-top:4px;white-space:pre-wrap}

.right{border-left:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.right h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.working{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.2s infinite}
.dot.done{background:var(--ok)}
.dot.error{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
.act{padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.act b{display:block;font-weight:600}
.act span{color:var(--muted)}
.deploy-box{padding:12px;border-radius:12px;border:1px solid var(--border-2);font-size:13px}
.deploy-box.ok{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.06);color:var(--ok)}
.deploy-box a{word-break:break-all;color:var(--cyan)}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--panel-2);border:1px solid var(--border-2);border-left:3px solid var(--cyan);padding:10px 14px;border-radius:10px;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.ok{border-left-color:var(--ok)}
.toast.error{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}

@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .right{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side,.topnav,.upgrade{display:none}
  header{padding:0 12px;gap:10px}
  .code{grid-template-columns:1fr}
  .explorer{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}
  .label{display:none}
  .ws{min-height:480px}
  .change{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">B</div>
      <div><div class="name"><span class="gradtext">BeraForge</span> AI</div><small>BY BERA TECH</small></div>
    </div>
    <nav class="topnav">
      <a data-go="dashboard">Home</a>
      <a data-go="projects">Projects</a>
      <a data-go="providers">API Providers</a>
      <a data-soon>Docs</a>
    </nav>
    <div class="spacer"></div>
    <button class="btn upgrade" data-soon>✦ Upgrade</button>
    <div class="avatar">B</div>
  </header>

  <aside class="side">
    <button class="btn-grad new" data-action="new">+ New Project</button>
    <nav class="sidenav">
      <a data-go="dashboard">Dashboard</a>
      <a data-go="projects">My Projects</a>
      <a data-go="providers">API Providers</a>
      <a data-go="deployments">Deployments</a>
      <a data-soon>Usage and Billing</a>
      <a data-soon>Settings</a>
    </nav>
    <div class="card plan">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Free Plan</b><span class="badge" data-soon>Upgrade</span></div>
      <div class="muted" style="margin-top:10px;display:flex;justify-content:space-between"><span>Projects</span><span id="planCount">0 / 10</span></div>
      <div class="bar"><i id="planBar" style="width:0%"></i></div>
    </div>
  </aside>

  <main>
    <section class="card hero" id="hero"></section>
    <section id="content"></section>
  </main>

  <aside class="right" id="right"></aside>
</div>
<div class="toasts" id="toasts"></div>

<script>
const AGENTS = ['Planner', 'API', 'Frontend', 'QA', 'Integration', 'Deployment'];
const PLAN_LIMIT = 10;
const CHIPS = {
  'Full Stack App': 'Full-stack todo app with a clean UI, local state and a settings panel',
  'Website': 'Modern one-page marketing website for a software startup with a hero, features and a contact form',
  'API': 'REST API explorer page where I can send requests to any URL and view formatted JSON responses',
  'Mobile App': 'Mobile-first habit tracker with daily check-ins and streak counters',
  'Dashboard': 'Analytics dashboard with KPI cards, a line chart and a recent activity table',
  'Blog': 'Minimal blog with a post list, reading view and a search box',
  'E-commerce': 'E-commerce storefront with a product grid, cart drawer and checkout summary'
};
const STATUS_LABEL = { draft: 'Draft', building: 'Building', ready: 'Ready', failed: 'Failed' };

const S = {
  projects: [], providers: [], tests: {}, current: null, view: 'home',
  file: 'index.html', tab: 'code', busy: false, deploying: false, dirty: false,
  device: 'desktop', provider: 'ai_gpt'
};

const $ = (sel) => document.querySelector(sel);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const chatOptions = () => S.providers.filter((p) => p.kind === 'chat' && p.enabled);

async function api(path, { method = 'GET', body } = {}) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `Request failed (${res.status})`);
    err.data = data;
    throw err;
  }
  return data;
}

function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

async function refreshList() {
  try {
    S.projects = (await api('/api/projects')).projects;
  } catch (e) {
    toast(e.message, 'error');
  }
  $('#planCount').textContent = `${S.projects.length} / ${PLAN_LIMIT}`;
  $('#planBar').style.width = Math.min(100, (S.projects.length / PLAN_LIMIT) * 100) + '%';
}

async function loadProviders() {
  try {
    S.providers = (await api('/api/providers')).providers;
  } catch (e) {
    toast(e.message, 'error');
  }
  if (!chatOptions().some((p) => p.id === S.provider)) S.provider = chatOptions()[0]?.id || 'ai_gpt';
}

function goDashboard() {
  S.current = null;
  S.view = 'home';
  refreshList().then(renderAll);
}

function showProviders() {
  S.current = null;
  S.view = 'providers';
  loadProviders().then(renderAll);
}

async function openProject(id) {
  try {
    S.current = await api(`/api/projects/${encodeURIComponent(id)}`);
    S.view = 'home';
    S.tab = 'code';
    S.file = S.current.files['index.html'] !== undefined ? 'index.html' : Object.keys(S.current.files)[0];
    S.dirty = false;
    renderAll();
  } catch (e) {
    toast(e.message, 'error');
  }
}

// Subscribes to a build's live events. Resolves with true/false when the build finishes.
function watch(id) {
  return new Promise((resolve) => {
    const es = new EventSource(`/api/projects/${encodeURIComponent(id)}/events`);
    const finish = (ok) => { es.close(); resolve(ok); };
    const on = (type, fn) => es.addEventListener(type, (e) => fn(JSON.parse(e.data)));

    on('snapshot', (d) => {
      if (S.current?.id === id) { S.current.lastLog = d.log; S.current.status = d.status; renderLive(); }
      if (d.status !== 'building') finish(d.status === 'ready');
    });
    on('log', (d) => {
      if (S.current?.id === id) { S.current.lastLog.push(d); renderLive(); }
    });
    on('status', (d) => {
      if (S.current?.id === id) { S.current.status = d.status; renderLive(); }
    });
    on('done', (d) => finish(d.ok));
  });
}

async function startBuild(text, mode = 'new') {
  if (!text) return toast('Describe the change or app first.', 'warn');
  if (S.busy) return;
  S.busy = true;
  renderAll();
  try {
    if (mode === 'new' || !S.current) {
      S.current = await api('/api/projects', { method: 'POST', body: { prompt: text } });
      S.view = 'home';
      S.file = 'index.html';
      S.tab = 'code';
    }
    const id = S.current.id;
    await api(`/api/projects/${encodeURIComponent(id)}/generate`, {
      method: 'POST',
      body: { prompt: text, provider: S.provider, mode }
    });
    renderAll();
    const ok = await watch(id);
    S.current = await api(`/api/projects/${encodeURIComponent(id)}`);
    toast(ok ? 'Build saved. Open the Preview tab.' : 'Build failed. See the Logs tab.', ok ? 'ok' : 'error');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    S.busy = false;
    await refreshList();
    renderAll();
  }
}

function applyChange() {
  const text = $('#change')?.value.trim();
  if (!text) return toast('Describe the change first.', 'warn');
  startBuild(text, 'edit');
}

async function testProvider(id) {
  S.tests[id] = { pending: true };
  renderContent();
  try {
    S.tests[id] = await api(`/api/providers/${encodeURIComponent(id)}/test`, { method: 'POST' });
  } catch (e) {
    S.tests[id] = { ok: false, error: e.message };
  }
  await loadProviders();
  renderContent();
}

async function toggleProvider(id) {
  const p = S.providers.find((x) => x.id === id);
  if (!p) return;
  try {
    await api(`/api/providers/${encodeURIComponent(id)}`, { method: 'PATCH', body: { enabled: !p.enabled } });
    await loadProviders();
    renderAll();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function restore(versionId) {
  try {
    S.current = await api(`/api/projects/${encodeURIComponent(S.current.id)}/restore/${encodeURIComponent(versionId)}`, { method: 'POST' });
    S.file = 'index.html';
    S.dirty = false;
    toast('Checkpoint restored', 'ok');
    renderAll();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deploy() {
  const p = S.current;
  if (!p || S.deploying) return;
  S.deploying = true;
  renderAll();
  try {
    const d = await api(`/api/projects/${encodeURIComponent(p.id)}/deploy`, { method: 'POST' });
    p.deployments.unshift(d);
    toast('Deployment started on Vercel.', 'ok');
    renderRight();
    for (let i = 0; i < 40 && !['READY', 'ERROR', 'CANCELED'].includes(d.state); i++) {
      await sleep(3000);
      Object.assign(d, await api(`/api/projects/${encodeURIComponent(p.id)}/deployments/${encodeURIComponent(d.id)}`));
      renderRight();
    }
    if (d.state === 'READY') toast('Deployment is live.', 'ok');
    else if (d.state === 'ERROR' || d.state === 'CANCELED') toast(`Deployment ${d.state.toLowerCase()}.`, 'error');
    else toast('Still deploying. Check the Logs tab shortly.', 'warn');
  } catch (e) {
    const hint = e.data?.setup ? ` ${e.data.setup}` : '';
    toast(e.message + hint, 'warn');
  } finally {
    S.deploying = false;
    renderAll();
  }
}

async function saveFile() {
  const p = S.current;
  if (!p) return;
  const content = $('#editor')?.value ?? '';
  try {
    await api(`/api/projects/${encodeURIComponent(p.id)}/files/${encodeURIComponent(S.file)}`, {
      method: 'PUT',
      body: { content }
    });
    p.files[S.file] = content;
    S.dirty = false;
    toast(`Saved ${S.file}`, 'ok');
    renderContent();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function switchFile(name) {
  if (S.dirty && !confirm('Discard unsaved changes?')) return;
  S.file = name;
  S.dirty = false;
  renderContent();
}

async function renameProject() {
  const p = S.current;
  const name = window.prompt('Project name', p.name);
  if (!name || !name.trim()) return;
  try {
    const updated = await api(`/api/projects/${encodeURIComponent(p.id)}`, { method: 'PATCH', body: { name: name.trim() } });
    p.name = updated.name;
    await refreshList();
    renderAll();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteProject() {
  const p = S.current;
  if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
  try {
    await api(`/api/projects/${encodeURIComponent(p.id)}`, { method: 'DELETE' });
    S.current = null;
    toast('Project deleted', 'ok');
    await refreshList();
    renderAll();
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* ---------- Rendering ---------- */
function renderAll() {
  renderHero();
  renderContent();
  renderRight();
}

// Updates only the live parts, so unsaved editor text is not lost while a build runs.
function renderLive() {
  renderRight();
  const p = S.current;
  if (!p) return;
  const badge = $('#wsStatus');
  if (badge) {
    const st = S.busy ? 'building' : p.status;
    badge.className = `badge ${st}`;
    badge.textContent = STATUS_LABEL[st] || st;
  }
  const pre = $('#logsPre');
  if (pre) {
    pre.innerHTML = logLines(p);
    pre.scrollTop = pre.scrollHeight;
  }
}

function renderHero() {
  const el = $('#hero');
  if (S.current || S.view === 'providers') {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  const keep = $('#prompt')?.value ?? '';
  el.style.display = '';
  el.innerHTML = `
    <h1>✦ Build Your Next Application with <span class="gradtext">AI</span></h1>
    <p>Describe your idea. The agents plan, generate, check and save it.</p>
    <div class="prompt">
      <textarea id="prompt" rows="2" placeholder="Create a modern e-commerce website with authentication and payment integration…"></textarea>
      <div class="prompt-side">
        ${providerSelect()}
        <button class="btn-grad" data-action="build" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Building…' : '✦ Build'}</button>
      </div>
    </div>
    <div class="chips">${Object.keys(CHIPS).map((k) => `<span class="chip" data-chip="${esc(k)}">${esc(k)}</span>`).join('')}</div>`;
  $('#prompt').value = keep;
}

function providerSelect() {
  return `<select class="btn" data-provider title="Chat model used for this build">${chatOptions().map((p) =>
    `<option value="${esc(p.id)}" ${p.id === S.provider ? 'selected' : ''}>${esc(p.path)}</option>`).join('')}</select>`;
}

function renderContent() {
  const el = $('#content');
  if (S.current) {
    el.innerHTML = workspaceHtml(S.current);
    return;
  }
  if (S.view === 'providers') {
    el.innerHTML = providersHtml();
    return;
  }
  if (!S.projects.length) {
    el.innerHTML = '<div class="card empty">No projects yet. Describe an app above and press Build.</div>';
    return;
  }
  el.innerHTML = `
    <h3 style="margin:0">My Projects</h3>
    <div class="grid">${S.projects.map((p) => `
      <div class="card pcard" data-open="${esc(p.id)}">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.prompt || 'No description')}</p>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="badge ${esc(p.status)}">${esc(STATUS_LABEL[p.status] || p.status)}</span>
          <span class="muted" style="font-size:12px">${ago(p.updatedAt)}</span>
        </div>
      </div>`).join('')}
    </div>`;
}

function providersHtml() {
  const rows = S.providers.map((p) => {
    const t = S.tests[p.id];
    const status = p.kind === 'disabled' ? 'locked' : p.verified ? 'verified' : 'untested';
    const cooling = p.cooldownUntil > Date.now() ? ' <span class="muted">cooling down</span>' : '';
    let result = '';
    if (t?.pending) result = '<span class="muted">testing…</span>';
    else if (t) result = t.ok
      ? `<span style="color:var(--ok)">${esc(t.contentType || '')} · ${t.latencyMs} ms</span><div class="muted preview">${esc(t.preview || '')}</div>`
      : `<span style="color:var(--err)">${esc(t.error)}</span>`;
    else if (p.lastError) result = `<span class="muted">last error: ${esc(p.lastError)}</span>`;
    return `<tr>
      <td><b>${esc(p.id)}</b><div class="muted" style="font-size:12px">${esc(p.path)}</div>${p.note ? `<div class="muted" style="font-size:12px">${esc(p.note)}</div>` : ''}</td>
      <td>${esc(p.kind)}</td>
      <td><span class="badge ${status}">${status}</span>${cooling}</td>
      <td class="muted">${p.lastLatencyMs != null ? p.lastLatencyMs + ' ms' : '—'}</td>
      <td>${p.kind === 'disabled'
        ? '<span class="muted">locked</span>'
        : `<button class="btn" data-toggle="${esc(p.id)}">${p.enabled ? 'Disable' : 'Enable'}</button>`}</td>
      <td><button class="btn" data-test="${esc(p.id)}" ${p.kind === 'disabled' || t?.pending ? 'disabled' : ''}>Test</button></td>
      <td class="result">${result}</td>
    </tr>`;
  }).join('');
  return `
    <h3 style="margin:0">API Providers</h3>
    <p class="muted" style="margin:0">Chat providers build apps. Research and media endpoints can be tested here but are never used for code generation. Builds fall back to the next enabled chat provider if one fails, and the Logs tab shows which one answered.</p>
    <div class="card" style="overflow:auto">
      <table class="ptable">
        <thead><tr><th>Endpoint</th><th>Kind</th><th>Status</th><th>Latency</th><th></th><th></th><th>Last test</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function workspaceHtml(p) {
  const status = S.busy ? 'building' : p.status;
  const dep = p.deployments[0];
  const tabs = [['code', 'Code'], ['preview', 'Preview'], ['logs', 'Logs'], ['versions', 'Versions']];
  const body = S.tab === 'code' ? codeHtml(p)
    : S.tab === 'preview' ? previewHtml(p)
    : S.tab === 'logs' ? `<pre class="logs" id="logsPre">${logLines(p)}</pre>`
    : versionsHtml(p);
  return `
    <section class="card ws">
      <div class="ws-head">
        <button class="btn" data-action="back">← Dashboard</button>
        <div class="ws-title">▣ ${esc(p.name)} <span id="wsStatus" class="badge ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span></div>
        <div class="spacer"></div>
        <button class="btn" data-action="rename">Rename</button>
        <button class="btn" data-action="delete">Delete</button>
        <button class="btn-grad" data-action="deploy" ${S.busy || S.deploying ? 'disabled' : ''}>${S.deploying ? 'Deploying…' : 'Deploy'}</button>
      </div>
      <div class="change">
        <input id="change" placeholder="Ask for a change, e.g. add a dark mode toggle" ${S.busy ? 'disabled' : ''} />
        ${providerSelect()}
        <button class="btn-grad" data-action="change" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Working…' : 'Apply'}</button>
      </div>
      <div class="tabs">
        ${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}
        ${dep && dep.url ? `<a class="url" href="${esc(dep.url)}" target="_blank" rel="noopener">${esc(dep.url)} ↗</a>` : ''}
      </div>
      ${body}
    </section>`;
}

function codeHtml(p) {
  return `
    <div class="code">
      <div class="explorer">
        <div class="label">EXPLORER</div>
        ${Object.keys(p.files).map((f) => `<button class="file ${f === S.file ? 'on' : ''}" data-file="${esc(f)}">📄 ${esc(f)}</button>`).join('')}
      </div>
      <div class="editor">
        <div class="editor-bar">
          <span>${esc(S.file)} <span style="color:var(--warn)">${S.dirty ? '● unsaved' : ''}</span></span>
          <button class="btn" data-action="save">Save (Ctrl+S)</button>
        </div>
        <textarea id="editor" spellcheck="false">${esc(p.files[S.file] ?? '')}</textarea>
      </div>
    </div>`;
}

function previewHtml(p) {
  const widths = { desktop: '100%', tablet: '820px', mobile: '390px' };
  const id = encodeURIComponent(p.id);
  return `
    <div class="preview-bar">
      <div class="seg">
        ${Object.keys(widths).map((d) => `<button class="${S.device === d ? 'on' : ''}" data-device="${d}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}
      </div>
      <button class="btn" data-action="refresh">↻ Refresh</button>
      <a class="btn" href="/preview/${id}/" target="_blank" rel="noopener">Open in new tab ↗</a>
    </div>
    <div class="frame-wrap">
      <iframe id="frame" title="Live preview" sandbox="allow-scripts allow-forms allow-modals"
        style="width:${widths[S.device]}" src="/preview/${id}/?t=${Date.now()}"></iframe>
    </div>`;
}

function logLines(p) {
  const lines = (p?.lastLog || []).map((l) =>
    `<span class="lvl-${esc(l.level)}">[${fmtTime(l.at)}] ${esc(l.agent)} ${esc(l.level.toUpperCase())}: ${esc(l.msg)}</span>`);
  (p?.deployments || []).slice().reverse().forEach((d) =>
    lines.push(`<span>[${fmtTime(d.createdAt)}] Deployment ${esc(d.id)} → ${esc(d.state)} ${esc(d.url || '')}</span>`));
  return lines.length ? lines.join('\n') : 'No build output yet. Describe an app and press Build.';
}

function versionsHtml(p) {
  if (!p.versions.length) {
    return '<div class="empty">No checkpoints yet. Each successful build or change saves the previous version here.</div>';
  }
  return `<div class="versions">${p.versions.map((v) => `
    <div class="ver">
      <div><b>${ago(v.at)}</b> <span class="muted">${esc(v.label.slice(0, 140))}</span></div>
      <button class="btn" data-restore="${esc(v.id)}">Restore</button>
    </div>`).join('')}</div>`;
}

function renderRight() {
  const p = S.current;
  const log = p?.lastLog || [];
  const lastAgent = log.length ? log[log.length - 1].agent : null;

  const state = (name) => {
    if (name === 'Deployment') {
      if (S.deploying) return 'working';
      const d = p?.deployments?.[0];
      if (!d) return 'idle';
      if (d.state === 'READY') return 'done';
      if (d.state === 'ERROR' || d.state === 'CANCELED') return 'error';
      return 'working';
    }
    const mine = log.filter((e) => e.agent === name);
    if (!mine.length) return 'idle';
    if (S.busy && name === lastAgent) return 'working';
    return mine.some((e) => e.level === 'error') ? 'error' : 'done';
  };

  const activity = log.slice(-8).reverse()
    .map((e) => `<div class="act"><b class="lvl-${esc(e.level)}">${esc(e.agent)}</b><span>${esc(e.msg)}</span><div class="muted" style="font-size:11px">${ago(e.at)}</div></div>`)
    .join('') || '<div class="muted">No agent activity yet.</div>';

  const d = p?.deployments?.[0];
  let deployHtml;
  if (!p) deployHtml = '<div class="muted">Open a project to deploy it.</div>';
  else if (!d) deployHtml = '<div class="muted">Not deployed yet. Press Deploy to publish.</div>';
  else deployHtml = `
    <div class="deploy-box ${d.state === 'READY' ? 'ok' : ''}">
      <b>${d.state === 'READY' ? 'Deployment successful' : 'Deployment ' + esc(d.state)}</b>
      ${d.url ? `<div style="margin-top:6px"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)}</a></div>` : ''}
    </div>`;

  $('#right').innerHTML = `
    <div>
      <h4>Live Agents <span style="color:var(--cyan);font-size:12px">${S.busy ? '● working' : ''}</span></h4>
      ${AGENTS.map((n) => {
        const st = state(n);
        return `<div class="row"><span class="dot ${st}"></span><span>${n}</span><span class="muted" style="margin-left:auto;font-size:12px">${st}</span></div>`;
      }).join('')}
    </div>
    <div><h4>Agent Activity</h4>${activity}</div>
    <div><h4>Deployment</h4>${deployHtml}</div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action],[data-open],[data-file],[data-tab],[data-device],[data-go],[data-chip],[data-soon],[data-test],[data-toggle],[data-restore]');
  if (!el) return;
  const d = el.dataset;

  if ('soon' in d) return toast('Not part of this build yet.', 'info');
  if ('go' in d) {
    if (d.go === 'providers') return showProviders();
    if (d.go === 'deployments') {
      if (S.current) { S.tab = 'logs'; renderAll(); }
      else toast('Open a project to see its deployments.', 'info');
      return;
    }
    if (d.go === 'projects') return goDashboard();
    return goDashboard();
  }
  if ('chip' in d) {
    const ta = $('#prompt');
    if (ta) { ta.value = CHIPS[d.chip]; ta.focus(); }
    return;
  }
  if ('open' in d) return openProject(d.open);
  if ('file' in d) return switchFile(d.file);
  if ('tab' in d) { S.tab = d.tab; return renderAll(); }
  if ('device' in d) { S.device = d.device; return renderContent(); }
  if ('test' in d) return testProvider(d.test);
  if ('toggle' in d) return toggleProvider(d.toggle);
  if ('restore' in d) return restore(d.restore);

  switch (d.action) {
    case 'new':
      S.current = null;
      S.view = 'home';
      renderAll();
      $('#prompt')?.focus();
      break;
    case 'build': return startBuild($('#prompt')?.value.trim(), 'new');
    case 'change': return applyChange();
    case 'back': return goDashboard();
    case 'save': return saveFile();
    case 'refresh': return renderContent();
    case 'deploy': return deploy();
    case 'rename': return renameProject();
    case 'delete': return deleteProject();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.matches('[data-provider]')) S.provider = e.target.value;
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'editor') {
    S.dirty = true;
    const tag = e.target.closest('.editor')?.querySelector('.editor-bar span span');
    if (tag) tag.textContent = '● unsaved';
  }
});

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.current && S.tab === 'code') {
    e.preventDefault();
    saveFile();
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'prompt') {
    e.preventDefault();
    startBuild($('#prompt').value.trim(), 'new');
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'change') {
    e.preventDefault();
    applyChange();
  }
});

/* ---------- Init ---------- */
(async function init() {
  await Promise.all([refreshList(), loadProviders()]);
  renderAll();
})();
</script>
</body>
</html>
